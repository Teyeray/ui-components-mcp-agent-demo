services:
  redis:
    image: redis:7-alpine
    container_name: ui-mcp-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: ui-mcp-server
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - MCP_PORT=8001
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./mcp-server/src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/sse')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ui-mcp-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - MCP_SERVER_URL=http://mcp-server:8001
      - LLM_MODEL=${LLM_MODEL:-deepseek/deepseek-chat}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ui-mcp-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    restart: unless-stopped

  # agent: standalone ADK web service (optional, not used by backend)
  # Uncomment if you need the ADK web UI at port 8002.
  # agent:
  #   build:
  #     context: ./agent
  #     dockerfile: Dockerfile
  #   container_name: ui-mcp-agent
  #   ports:
  #     - "8002:8002"
  #   environment:
  #     - MCP_SERVER_URL=http://mcp-server:8001
  #     - LLM_MODEL=${LLM_MODEL:-deepseek/deepseek-chat}
  #     - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
  #     - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
  #   depends_on:
  #     mcp-server:
  #       condition: service_started
  #   volumes:
  #     - ./agent/src:/app/src
  #   restart: unless-stopped
  #   command: ["./start_web.sh"]

volumes:
  redis_data:
    driver: local
  backend_data:
    driver: local

networks:
  default:
    name: ui-mcp-network
