[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-demo-backend"
version = "0.1.0"
description = "Backend service for Agent Demo"
authors = [
    {name = "yangruiming", email = "yangruiming2001@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "redis>=4.5.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.21.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "google-adk>=0.1.0",
    "litellm>=1.72.6"
]
